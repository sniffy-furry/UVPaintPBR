name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK & CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # First build fetches + compiles assimp from source (~5-10 min). Cached after that.
      - name: Cache Gradle & native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
            ~/.android/debug.keystore
          key: ${{ runner.os }}-gradle-cxx-${{ hashFiles('**/*.gradle*', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-cxx-

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uvpaint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
